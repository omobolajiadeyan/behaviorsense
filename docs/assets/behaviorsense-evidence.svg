  <rect x="1008" y="426" width="94" height="32" rx="16" fill="#b42318"/>
  <text x="1022" y="448" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="800">CRITICAL</text>
  <text x="136" y="496" fill="#344154" font-family="Arial, sans-serif" font-size="20">High failure rate, many source IPs, broad endpoint access, large transfer volume, and off-hours activity.</text>
